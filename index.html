<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>What’s This? - AI Object Explainer</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      background-color: #f7f9fc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .container {
      width: 95%;
      max-width: 450px;
      background: white;
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.1);
      text-align: center;
    }
    h2 {
      font-size: 24px;
      margin-bottom: 5px;
    }
    .subtitle {
      font-size: 16px;
      color: #666;
      margin-bottom: 15px;
    }
    #cameraPlaceholder {
      width: 100%;
      background-color: #eef1f5;
      border-radius: 12px;
      padding: 40px 10px;
      color: #666;
      font-size: 16px;
      margin-bottom: 10px;
      border: 2px dashed #ccc;
    }
    video {
      display: none;
      width: 100%;
      border-radius: 12px;
      margin-bottom: 10px;
    }
    canvas {
      display: none;
    }
    button {
      background-color: #0066ff;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 12px;
      font-size: 16px;
      width: 100%;
      margin: 10px 0;
      cursor: pointer;
    }
    button:hover {
      background-color: #0052cc;
    }
    #result {
      background-color: #f0f4f8;
      padding: 16px;
      border-radius: 12px;
      margin-top: 16px;
      text-align: left;
      font-size: 15px;
      line-height: 1.6;
      color: #333;
    }
    #result p {
      margin: 0 0 10px 0;
    }
    .loading {
      font-size: 16px;
      color: #0066ff;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>What’s This?</h2>
    <div class="subtitle">AI Object Explainer</div>
    <div id="cameraPlaceholder">Upload image from gallery or take photo to allow camera access</div>
    <video id="camera" autoplay playsinline></video>
    <input type="file" id="imageUpload" accept="image/*" style="width: 100%; margin: 10px 0;" />
    <canvas id="canvas"></canvas>
    <button onclick="startCameraAndCapture()">Snap from Camera</button>
    <div id="result"></div>
  </div>

  <script>
    const video = document.getElementById("camera");
    const canvas = document.getElementById("canvas");
    const resultDiv = document.getElementById("result");
    const placeholder = document.getElementById("cameraPlaceholder");
    const imageUpload = document.getElementById("imageUpload");

    imageUpload.addEventListener("change", async (event) => {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onloadend = async () => {
        resultDiv.innerHTML = '<div class="loading">Analyzing photo, please wait...</div>';
        try {
          const res = await fetch("/api/explain-object", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ imageDataURL: reader.result })
          });
          const data = await res.json();
          if (data?.choices?.[0]?.message?.content) {
            const paragraphs = data.choices[0].message.content.trim().split("\n\n");
            resultDiv.innerHTML = paragraphs.map(p => `<p>${p.trim()}</p>`).join('');
          } else {
            resultDiv.innerHTML = "<div class='loading'>I couldn't figure that out. Try again with a clearer or closer photo.</div>";
          }
        } catch (err) {
          console.error("[GPT Debug] Error:", err);
          resultDiv.innerHTML = "<div class='loading'>Something went wrong. Please try again in a few seconds.</div>";
        }
      };
      reader.readAsDataURL(file);
    });

    async function startCameraAndCapture() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio: false });
        video.srcObject = stream;
        video.style.display = "block";
        placeholder.style.display = "none";
        setTimeout(() => captureAndExplain(), 1500);
      } catch (err) {
        alert("Camera access denied or not available.");
        console.error(err);
      }
    }

    async function captureAndExplain() {
      resultDiv.innerHTML = '<div class="loading">Analyzing photo, please wait...</div>';
      const ctx = canvas.getContext("2d");
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      const base64Image = canvas.toDataURL("image/jpeg");

      try {
        const res = await fetch("/api/explain-object", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ imageDataURL: base64Image })
        });
        const data = await res.json();
        if (data?.choices?.[0]?.message?.content) {
          const paragraphs = data.choices[0].message.content.trim().split("\n\n");
          resultDiv.innerHTML = paragraphs.map(p => `<p>${p.trim()}</p>`).join('');
        } else {
          resultDiv.innerHTML = "<div class='loading'>I couldn't figure that out. Try again with a clearer or closer photo.</div>";
        }
      } catch (err) {
        console.error("[GPT Debug] Error:", err);
        resultDiv.innerHTML = "<div class='loading'>Something went wrong. Please try again in a few seconds.</div>";
      }
    }
  </script>
</body>
</html>
